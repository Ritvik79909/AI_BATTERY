spring.application.name=AI-battery
spring.datasource.url=jdbc:mysql://localhost:3306/ev_battery_db
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

gemini.api.key=${GEMINI_API_KEY}


# Reduce log noise
logging.level.com.ev.AI_battery.security=INFO
logging.level.org.springframework.security=WARN

# Add to existing application.properties

# NREL API Configuration
openchargemap.api.key=${OPEN_API_KEY}

# Connection pool settings to prevent ECONNRESET
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

# Increase timeout for API calls
spring.mvc.async.request-timeout=60000

# Logging for debugging
logging.level.com.ev.AI_battery.service.NrelApiService=DEBUG
logging.level.com.ev.AI_battery.service.StationRecommendationService=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# XGBoost Model Configuration
xgboost.model.path=src/main/resources/ml/xgboost_battery_model.pkl

# SHAP Explainer Model Configuration (for Gemini prompt generation)
shap.model.path=src/main/resources/ml/gemini_prompt_model.pkl

# Python executable
python.executable=python
